<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
	<link rel="stylesheet" th:href="@{/css/index.css}">
	<script th:src="@{/js/index.js}" defer></script>
</head>
<body>
	<main class="page-container">
		<section class="form-panel">
			
			<h1 class="form-title">ログイン</h1>
			<h3>会員情報を入力してください。</h3>
			
		    <form class="user-form"
						th:action="@{/login}"
						th:object="${loginForm}"
						method="post">
		
				<div class="form-field">
			        <label class="form-label" for="id">ID</label>
			        <input class="form-input" type="text" th:field="*{id}">
					
					<span class="form-error"
						 th:if="${#fields.hasErrors('id')}"
					     th:errors="*{id}">
					</span>
				</div>
				
				<div class="form-field">
			        <label class="form-label" for="password">PASSWORD</label>
			        <input class="form-input" type="password" th:field="*{password}">
					
					<span class="form-error"
						 th:if="${#fields.hasErrors('password')}"
				     	 th:errors="*{password}">
					</span>
				</div>
				
				<p class="form-error"
				   th:if="${loginError}"
				   th:text="${loginError}">
				</p>
		
		        <button class="submit-button" type="submit">送信</button>				
		    </form>
		</section>
	</main>
</body>
</html>
