<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BMI計算</title>
	<link rel="stylesheet" th:href="@{/css/index.css}">
	<script th:src="@{/js/index.js}" defer></script>
</head>
<body>
	<main class="page-container">
		<section class="form-panel">
			
			<h1 class="form-title">身体情報入力</h1>
			<h3>各必須項目を入力してください。</h3>
			
		    <form class="user-form"
						th:action="@{/submit}"
						th:object="${userForm}"
						method="post">
		
				<div class="form-field">
			        <label class="form-label" for="date">日付</label>
			        <input class="form-input" type="date" th:field="*{date}">
					
					<span class="form-error"
						 th:if="${#fields.hasErrors('date')}"
					     th:errors="*{date}">
					</span>
				</div>
				
				<div class="form-field">
			        <label class="form-label" for="lastName">姓</label>
			        <input class="form-input" type="text"
						th:field="*{lastName}" placeholder="例）けんこう">
					
					<span class="form-error"
						 th:if="${#fields.hasErrors('lastName')}"
				     	 th:errors="*{lastName}">
					</span>
				</div>
				
				<div class="form-field">
			        <label class="form-label" for="firstName">名</label>
			        <input class="form-input" type="text"
						th:field="*{firstName}" placeholder="例）たろう">
					
					<span class="form-error"
						 th:if="${#fields.hasErrors('firstName')}"
					     th:errors="*{firstName}">
					</span>
				</div>
				
				<fieldset class="form-field">
			        <legend class="form-label">生年月日</legend>
					
					<div class="birth-date">
						<select th:field="*{birthYear}">
							<option value="">---</option>
							<option th:each="year : ${#numbers.sequence(1940, 2026)}"
										 th:value="${year}"
										 th:text="${year}">
							</option>
						</select>
						<span>年</span>
						
						<select th:field="*{birthMonth}">
							<option value="">---</option>
							<option th:each="month : ${#numbers.sequence(1, 12)}"
										 th:value="${month}"
										 th:text="${month}">
							</option>
						</select>
						<span>月</span>
						
						<select th:field="*{birthDay}">
							<option value="">---</option>
							<option th:each="day : ${#numbers.sequence(1, 31)}"
										th:value="${day}"
										th:text="${day}">
							</option>
						</select>
						<span>日</span>
					</div>
					
					<span class="form-error"
						 th:if="${#fields.hasErrors('birthDay')}"
				     	 th:errors="*{birthDay}">
					</span>
				</fieldset>
		
				<div class="form-field">
			        <label class="form-label" for="height">身長</label>
			        <input class="form-input" type="number"
						th:field="*{height}" step="0.1" min="50" max="250" inputmode="decimal">
					
					<span class="form-error"
						 th:if="${#fields.hasErrors('height')}"
					     th:errors="*{height}">
					</span>
				</div>
		
				<div class="form-field">
			        <label class="form-label" for="weight">体重</label>
			        <input class="form-input"type="number" 
						th:field="*{weight}" step="0.1" min="20" max="300" inputmode="decimal">
					
					<span class="form-error"
						 th:if="${#fields.hasErrors('weight')}"
					     th:errors="*{weight}">
					</span>
				</div>
		
		        <button class="submit-button" type="submit">送信</button>
		    </form>
		</section>
	</main>
</body>
</html>
