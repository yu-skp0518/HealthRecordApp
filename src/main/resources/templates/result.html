<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>計算結果</title>
</head>
<body>
    <h1>計算結果</h1>

    <p>
        あなたの名前：
        <span th:text="${result.fullName}"></span>
    </p>

    <p>
        身長：
        <span th:text="${result.height}"></span>
    </p>

    <p>
        体重：
        <span th:text="${result.weight}"></span>
    </p>

    <p>
        BMI：
        <span th:text="${result.bmi}"></span>
    </p>

    <a th:href="@{/index}">入力画面へ戻る</a>
</body>
</html>
